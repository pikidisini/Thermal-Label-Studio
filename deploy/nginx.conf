pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  # Request paths contain external identities. Do not log paths or credentials.
  access_log off;
  error_log /dev/stderr crit;
  server_tokens off;
  limit_conn_zone $binary_remote_addr zone=clients:1m;
  upstream studio { server app:8000; }
  server {
    listen 8443 ssl;
    ssl_certificate /etc/tls/server.crt;
    ssl_certificate_key /etc/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_conn clients 32;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
      proxy_pass http://studio;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 15s;
      proxy_next_upstream off;
    }
  }
}
