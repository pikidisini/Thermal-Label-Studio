name: AI Pull Request Reviewer & Security Guardrail

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    name: Automated PR Quality & Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect Git Diff & Security Sanity Check
        id: security-check
        run: |
          echo "=== Scanning for potential sensitive leaks in diff ==="
          # Check for dangerous patterns in changed files
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          
          LEAK_FOUND=0
          if grep -iE "(password|secret|api_key|private_key|token)\s*=\s*['\"][a-zA-Z0-9_\-]{8,}['\"]" pr_diff.txt; then
            echo "::error::Potential hardcoded secret/credential detected in Pull Request!"
            LEAK_FOUND=1
          fi

          echo "leak_found=$LEAK_FOUND" >> $GITHUB_OUTPUT

      - name: Generate PR Quality Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const leakFound = "${{ steps.security-check.outputs.leak_found }}" === "1";
            
            let comment = `### 🤖 Automated Code Quality & AI Review Guardrail\n\n`;
            
            if (leakFound) {
              comment += `> [!CAUTION]\n> **Peringatan Keamanan**: Ditemukan pola yang menyerupai *hardcoded secret/token* pada perubahan ini. Mohon periksa kembali!\n\n`;
            } else {
              comment += `> [!NOTE]\n> ✅ **Security Pre-check**: Tidak ditemukan kunci atau secret sensitif yang terekspos dalam diff.\n\n`;
            }

            comment += `#### 📋 Checklist Standar Pengujian:\n`;
            comment += `- [ ] Apakah seluruh unit test backend (\`pytest\`) & frontend (\`node --test\`) telah lolos di CI?\n`;
            comment += `- [ ] Apakah ada perubahan API schema yang memerlukan update Swagger UI / dokumentasi?\n`;
            comment += `- [ ] Apakah kode baru mengikuti konvensi penamaan standar dan bebas dari file cache (\`.pyc\`, \`node_modules\`)?\n\n`;
            comment += `*Automated check triggered by commit: \`${context.sha.substring(0, 7)}\`*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
