name: thermal-label-jenkins-local

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-label-jenkins-local:latest
    container_name: thermal-label-jenkins-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    group_add:
      - "0" # Docker Desktop socket belongs to root:root; this grants host-Docker control.
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
