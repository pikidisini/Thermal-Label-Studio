name: thermal-label-ci
services:
  jenkins:
    image: ${TLS_CI_JENKINS_IMAGE:?Tested migrated controller image}
    ports: ["192.168.254.58:8081:8080"]
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xmx1024m
    volumes:
      - jenkins-home:/var/jenkins_home
      - /etc/thermal-label-ci/agents:/run/tls-agents
      - /opt/thermal-label-ci/source/tools/jenkins/server/bootstrap.groovy:/var/jenkins_home/init.groovy.d/thermal-label-server.groovy:ro
    mem_limit: 2g
    cpus: 1.0
    restart: unless-stopped
  build-agent:
    image: ${TLS_CI_AGENT_IMAGE:?Tested agent image}
    user: "1000:1000"
    group_add: ["${TLS_CI_DOCKER_GID:?Host Docker socket group}"]
    environment:
      SONAR_SCANNER_JAVA_OPTS: -Xmx512m
    command: ["-url", "http://jenkins:8080", "-secret", "@/run/tls-agents/tls-build.secret", "-name", "tls-build", "-webSocket", "-workDir", "/opt/thermal-label-ci/work/build"]
    volumes:
      - /etc/thermal-label-ci/agents:/run/tls-agents:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/thermal-label-ci:/opt/thermal-label-ci
      - /opt/thermal-label-ci/work/build/home:/var/jenkins_home
      - /opt/thermal-label-studio:/opt/thermal-label-studio
      - /etc/thermal-label-studio:/etc/thermal-label-studio
      - /var/lib/thermal-label-ci:/var/lib/thermal-label-ci
      - /var/backups/thermal-label-studio:/var/backups/thermal-label-studio
    mem_limit: 1536m
    cpus: 1.0
    restart: unless-stopped
    depends_on: [jenkins]
  monitor-agent:
    image: ${TLS_CI_AGENT_IMAGE:?Tested agent image}
    user: "1000:1000"
    command: ["-url", "http://jenkins:8080", "-secret", "@/run/tls-agents/tls-monitor.secret", "-name", "tls-monitor", "-webSocket", "-workDir", "/opt/thermal-label-ci/work/monitor"]
    volumes:
      - /etc/thermal-label-ci/agents:/run/tls-agents:ro
      - /opt/thermal-label-ci/work/monitor:/opt/thermal-label-ci/work/monitor
      - /opt/thermal-label-ci/work/monitor/home:/var/jenkins_home
      - /var/lib/thermal-label-ci/monitor:/monitor:ro
      - /opt/thermal-label-ci/source/scripts/ci_monitor_view.py:/opt/ci-monitor-view.py:ro
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    depends_on: [jenkins]
  sonar-db:
    image: ${TLS_CI_POSTGRES_IMAGE:?Existing Sonar PostgreSQL image}
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Private database credential}
    volumes: [sonar-db:/var/lib/postgresql/data]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sonar -d sonar]
      interval: 10s
      timeout: 3s
      retries: 20
  sonarqube:
    image: ${TLS_CI_SONAR_IMAGE:?Existing SonarQube image}
    ports: ["192.168.254.58:9004:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Private database credential}
      SONAR_AUTH_JWTBASE64HS256SECRET: ${SONAR_AUTH_JWTBASE64HS256SECRET:?Preserved authentication secret}
      SONAR_WEB_JAVAOPTS: -Xms128m -Xmx512m
      SONAR_CE_JAVAOPTS: -Xms128m -Xmx512m
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
      - sonar-temp:/opt/sonarqube/temp
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped
    depends_on:
      sonar-db: {condition: service_healthy}
volumes:
  jenkins-home: {external: true, name: thermal-label-ci-jenkins-home}
  sonar-db: {external: true, name: thermal-label-ci-sonar-db}
  sonar-data: {external: true, name: thermal-label-ci-sonar-data}
  sonar-extensions: {external: true, name: thermal-label-ci-sonar-extensions}
  sonar-logs: {external: true, name: thermal-label-ci-sonar-logs}
  sonar-temp: {external: true, name: thermal-label-ci-sonar-temp}
