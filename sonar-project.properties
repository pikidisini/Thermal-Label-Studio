# Active source only. Archived prototypes, generated output and operational
# storage remain outside the analysis scope.
sonar.projectKey=thermal-label-studio
sonar.projectName=Thermal Label Studio
sonar.sourceEncoding=UTF-8
sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.py,frontend/tests/**/*
sonar.exclusions=.archive/**,.tmp/**,backend/data/**,backend/tests/**,backend/**/__pycache__/**,frontend/node_modules/**,frontend/dist/**,frontend/playwright-report/**,frontend/test-results/**,tools/**
sonar.coverage.exclusions=backend/tests/**,frontend/tests/**,frontend/src/**/*.d.ts
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.python.coverage.reportPaths=.tmp/coverage/python.xml
sonar.javascript.lcov.reportPaths=.tmp/coverage/frontend.lcov
