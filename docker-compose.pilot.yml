name: thermal-label-studio-pilot

services:
  db:
    image: postgres:15-bullseye
    container_name: pilot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thermal_label_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-pilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pilot_password_replace_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pilot_user} -d $${POSTGRES_DB:-thermal_label_pilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - pilot_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-label-studio:pilot
    container_name: pilot_app
    environment:
      PYTHONUNBUFFERED: "1"
      PRINT_AGENT_ENABLED: ${PRINT_AGENT_ENABLED:-true}
      PRINT_AGENT_REPOSITORY_BACKEND: ${PRINT_AGENT_REPOSITORY_BACKEND:-postgresql}
      PRINT_AGENT_DATABASE_URL: ${PRINT_AGENT_DATABASE_URL:-postgresql://pilot_user:pilot_password_replace_in_production@db:5432/thermal_label_pilot}
      PRINT_AGENT_DATABASE_POOL_MIN_SIZE: ${PRINT_AGENT_DATABASE_POOL_MIN_SIZE:-2}
      PRINT_AGENT_DATABASE_POOL_MAX_SIZE: ${PRINT_AGENT_DATABASE_POOL_MAX_SIZE:-10}
      PRINT_AGENT_ARTIFACT_ROOT: ${PRINT_AGENT_ARTIFACT_ROOT:-/app/artifacts}
      DEFAULT_DPI: ${DEFAULT_DPI:-203.2}
      PRINT_AGENT_SITE_ID: ${PILOT_SITE_ID:-pilot-site}
    volumes:
      - artifact_data:/app/artifacts
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - pilot_net

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: thermal-label-studio:pilot
    container_name: pilot_dispatcher
    command: ["python", "-m", "backend.app.print_jobs.central_dispatcher_runner"]
    environment:
      PYTHONUNBUFFERED: "1"
      PRINT_AGENT_DATABASE_URL: ${PRINT_AGENT_DATABASE_URL:-postgresql://pilot_user:pilot_password_replace_in_production@db:5432/thermal_label_pilot}
      PRINT_AGENT_ARTIFACT_ROOT: ${PRINT_AGENT_ARTIFACT_ROOT:-/app/artifacts}
      PRINT_AGENT_SITE_ID: ${PILOT_SITE_ID:-pilot-site}
      PRINT_AGENT_DISPATCHER_ID: ${PILOT_DISPATCHER_ID:-central-dispatcher-1}
      DISPATCHER_POLL_INTERVAL_SECONDS: ${DISPATCHER_POLL_INTERVAL_SECONDS:-2.0}
      DISPATCHER_LEASE_SECONDS: ${DISPATCHER_LEASE_SECONDS:-30}
      DISPATCHER_SOCKET_TIMEOUT: ${DISPATCHER_SOCKET_TIMEOUT:-10.0}
      PRINT_DISPATCH_ENABLED: ${PRINT_DISPATCH_ENABLED:-false}
      DISPATCHER_TRANSPORT_MODE: ${DISPATCHER_TRANSPORT_MODE:-simulator}
    volumes:
      - artifact_data:/app/artifacts
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pilot_net

volumes:
  postgres_data:
    name: pilot_postgres_data
  artifact_data:
    name: pilot_artifact_data

networks:
  pilot_net:
    name: pilot_network
    driver: bridge
