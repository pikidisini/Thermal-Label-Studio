<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="100mm" height="50mm"
     shape-rendering="crispEdges" text-rendering="geometricPrecision"
     font-family="Arial, 'DejaVu Sans', sans-serif" fill="#000000">

  <!-- Background & Outer Border -->
  <rect x="0" y="0" width="100" height="50" fill="#ffffff" stroke="none" />
  <rect x="0.4" y="0.4" width="99.2" height="49.2" fill="none" stroke="#000000" stroke-width="0.4" />

  <!-- HEADER -->
  <text x="3" y="7" font-size="5" font-weight="bold" data-field="brand">{{brand}}</text>
  <text x="97" y="7" font-size="4" font-weight="bold" text-anchor="end">CARTON BOX LABEL</text>
  <line x1="2" y1="9" x2="98" y2="9" stroke="#000000" stroke-width="0.3" />

  <!-- MATERIAL NUMBER & DESC -->
  <text x="3" y="14" font-size="2.4" fill="#333333">PART / MAT NO:</text>
  <text x="24" y="14" font-size="4.5" font-weight="bold" data-field="material_number">{{material_number}}</text>
  
  <text x="3" y="19" font-size="2.4" fill="#333333">DESCRIPTION:</text>
  <text x="24" y="19" font-size="3.2" font-weight="bold" data-field="material_description">{{material_description}}</text>

  <line x1="2" y1="22" x2="98" y2="22" stroke="#000000" stroke-width="0.25" />

  <!-- BATCH & QTY -->
  <text x="3" y="27" font-size="2.4" fill="#333333">BATCH:</text>
  <text x="14" y="27" font-size="3.8" font-weight="bold" data-field="batch_number">{{batch_number}}</text>

  <text x="45" y="27" font-size="2.4" fill="#333333">BOX NO:</text>
  <text x="58" y="27" font-size="3.8" font-weight="bold" data-field="box_no">{{box_no}}</text>

  <text x="75" y="27" font-size="2.4" fill="#333333">DATE:</text>
  <text x="83" y="27" font-size="3.2" font-weight="bold" data-field="production_date">{{production_date}}</text>

  <line x1="2" y1="30" x2="98" y2="30" stroke="#000000" stroke-width="0.25" />

  <!-- BARCODE & QR -->
  <rect data-barcode="barcode_batch" data-symbology="CODE128" x="4" y="32" width="68" height="11" fill="none" stroke="#000000" stroke-width="0.2" />
  <text x="38" y="47" font-size="2.6" font-weight="bold" text-anchor="middle" data-field="barcode_batch">{{barcode_batch}}</text>

  <rect data-qr="qr_traceability" x="78" y="31" width="17" height="17" fill="none" stroke="#000000" stroke-width="0.2" />
</svg>
