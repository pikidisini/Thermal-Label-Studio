<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100mm" height="150mm"
     shape-rendering="crispEdges" text-rendering="geometricPrecision"
     font-family="Arial, 'DejaVu Sans', sans-serif" fill="#000000">

  <!-- Background & Outer Border -->
  <rect x="0" y="0" width="100" height="150" fill="#ffffff" stroke="none" />
  <rect x="0.5" y="0.5" width="99" height="149" fill="none" stroke="#000000" stroke-width="0.5" />

  <!-- HEADER SECTION -->
  <g id="header">
    <text x="4" y="9" font-size="6.5" font-weight="bold" data-field="brand">{{brand}}</text>
    <text x="96" y="9" font-size="5" font-weight="bold" text-anchor="end">LOGISTICS PALLET</text>
    <line x1="2" y1="12" x2="98" y2="12" stroke="#000000" stroke-width="0.4" />
  </g>

  <!-- MATERIAL & DESCRIPTION -->
  <g id="material-info">
    <text x="4" y="17" font-size="2.6" fill="#333333">MATERIAL NUMBER:</text>
    <text x="4" y="23" font-size="5.5" font-weight="bold" data-field="material_number">{{material_number}}</text>

    <text x="4" y="29" font-size="2.6" fill="#333333">DESCRIPTION:</text>
    <text x="4" y="34" font-size="3.5" font-weight="bold" data-field="material_description">{{material_description}}</text>
    
    <line x1="2" y1="37" x2="98" y2="37" stroke="#000000" stroke-width="0.3" />
  </g>

  <!-- BATCH & SALES ORDER -->
  <g id="batch-so">
    <text x="4" y="42" font-size="2.6" fill="#333333">BATCH / CHARG:</text>
    <text x="4" y="48" font-size="5" font-weight="bold" data-field="batch_number">{{batch_number}}</text>

    <text x="54" y="42" font-size="2.6" fill="#333333">SALES ORDER / ITEM:</text>
    <text x="54" y="48" font-size="4" font-weight="bold" data-field="so_item">{{so_item}}</text>

    <line x1="2" y1="51" x2="98" y2="51" stroke="#000000" stroke-width="0.3" />
  </g>

  <!-- QUANTITY & WEIGHTS -->
  <g id="weights-section">
    <text x="4" y="56" font-size="2.6" fill="#333333">NET WEIGHT:</text>
    <text x="4" y="62" font-size="4.5" font-weight="bold"><tspan data-field="net_weight_kg">{{net_weight_kg}}</tspan> KG</text>

    <text x="36" y="56" font-size="2.6" fill="#333333">GROSS WEIGHT:</text>
    <text x="36" y="62" font-size="4.5" font-weight="bold"><tspan data-field="gross_weight_kg">{{gross_weight_kg}}</tspan> KG</text>

    <text x="70" y="56" font-size="2.6" fill="#333333">TOTAL ROLLS:</text>
    <text x="70" y="62" font-size="4.5" font-weight="bold" data-field="total_roll">{{total_roll}}</text>

    <line x1="2" y1="65" x2="98" y2="65" stroke="#000000" stroke-width="0.3" />
  </g>

  <!-- DATE & PALLET NO -->
  <g id="pallet-date">
    <text x="4" y="70" font-size="2.6" fill="#333333">PRODUCTION DATE:</text>
    <text x="4" y="75" font-size="3.5" font-weight="bold" data-field="production_date">{{production_date}}</text>

    <text x="54" y="70" font-size="2.6" fill="#333333">PALLET NUMBER:</text>
    <text x="54" y="75" font-size="3.5" font-weight="bold" data-field="pallet_no">{{pallet_no}}</text>

    <line x1="2" y1="78" x2="98" y2="78" stroke="#000000" stroke-width="0.3" />
  </g>

  <!-- PRIMARY 1D BARCODE (BATCH) -->
  <g id="barcode-batch-section">
    <text x="4" y="83" font-size="2.6" fill="#333333">BATCH BARCODE (CODE 128):</text>
    <rect data-barcode="barcode_batch" data-symbology="CODE128" x="6" y="86" width="88" height="15" fill="none" stroke="#000000" stroke-width="0.2" />
    <text x="50" y="104" font-size="3.2" font-weight="bold" text-anchor="middle" data-field="barcode_batch">{{barcode_batch}}</text>
  </g>

  <!-- SSCC PALLET BARCODE & QR CODE -->
  <g id="sscc-qr-section">
    <line x1="2" y1="107" x2="98" y2="107" stroke="#000000" stroke-width="0.3" />
    
    <text x="4" y="112" font-size="2.6" fill="#333333">SSCC PALLET BARCODE:</text>
    <rect data-barcode="pallet_hu_barcode" data-symbology="CODE128" x="4" y="114" width="62" height="15" fill="none" stroke="#000000" stroke-width="0.2" />
    <text x="35" y="132" font-size="3" font-weight="bold" text-anchor="middle" data-field="pallet_hu_barcode">{{pallet_hu_barcode}}</text>

    <rect data-qr="qr_traceability" x="72" y="111" width="24" height="24" fill="none" stroke="#000000" stroke-width="0.2" />
    <text x="84" y="138" font-size="2" text-anchor="middle">GS1 TRACE</text>
  </g>

  <!-- FOOTER -->
  <g id="footer">
    <line x1="2" y1="142" x2="98" y2="142" stroke="#000000" stroke-width="0.3" />
    <text x="4" y="146.5" font-size="2.2" fill="#555555">PLANT: 1100 | STANDARD LOGISTICS PALLET SPECIFICATION (100x150mm)</text>
  </g>
</svg>
