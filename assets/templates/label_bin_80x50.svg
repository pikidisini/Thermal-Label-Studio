<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80mm" height="50mm"
     shape-rendering="crispEdges" text-rendering="geometricPrecision"
     font-family="Arial, 'DejaVu Sans', sans-serif" fill="#000000">

  <!-- Background & Border -->
  <rect x="0" y="0" width="80" height="50" fill="#ffffff" stroke="none" />
  <rect x="0.4" y="0.4" width="79.2" height="49.2" fill="none" stroke="#000000" stroke-width="0.4" />

  <!-- STORAGE LOCATION HEADER -->
  <rect x="1" y="1" width="78" height="11" fill="#000000" stroke="none" />
  <text x="40" y="8.5" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle" data-field="storage_location">{{storage_location}}</text>

  <!-- MATERIAL NUMBER -->
  <text x="3" y="17" font-size="2.4" fill="#333333">MATERIAL / ITEM CODE:</text>
  <text x="3" y="23" font-size="4.5" font-weight="bold" data-field="material_number">{{material_number}}</text>

  <!-- DESCRIPTION -->
  <text x="3" y="28" font-size="2.8" font-weight="bold" data-field="material_description">{{material_description}}</text>
  <line x1="2" y1="30" x2="78" y2="30" stroke="#000000" stroke-width="0.25" />

  <!-- BARCODE & QR -->
  <rect data-barcode="barcode_batch" data-symbology="CODE128" x="3" y="32" width="53" height="11" fill="none" stroke="#000000" stroke-width="0.2" />
  <text x="29" y="47" font-size="2.4" font-weight="bold" text-anchor="middle" data-field="barcode_batch">{{barcode_batch}}</text>

  <rect data-qr="qr_traceability" x="61" y="32" width="15" height="15" fill="none" stroke="#000000" stroke-width="0.2" />
</svg>
