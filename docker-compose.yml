version: '3.8'

services:
  thermal-label-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermal-label-studio
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./assets/templates:/app/assets/templates
    environment:
      - PYTHONUNBUFFERED=1
      - DEFAULT_DPI=203.2
    restart: unless-stopped
