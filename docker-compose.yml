name: label-thermal-studio

services:
  label-thermal-studio:
    image: label-thermal-studio:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: label-thermal-studio
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./assets/templates:/app/assets/templates
    environment:
      - PYTHONUNBUFFERED=1
      - DEFAULT_DPI=203.2
    restart: unless-stopped
