<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply browser preferences before styles or React can paint the editor.
      (() => {
        let preference = {};
        try { preference = JSON.parse(localStorage.getItem('thermal-label-studio.preferences.v1') || '{}') || {}; } catch {}
        const selected = ['dark', 'light', 'industrial-dark', 'industrial-light', 'system', 'label-studio-signature'].includes(preference.theme) ? preference.theme : 'label-studio-signature';
        const systemDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = selected === 'system' ? (systemDark ? 'dark' : 'light') : selected;
        const tokens = {"bar": ["--ui-region-menu"], "tools": ["--ui-region-toolbar"], "panel": ["--ui-region-inspector"], "status": ["--ui-region-status"], "workspace": ["--ui-region-workspace"], "grid": ["--ui-viewport-dot"], "text": ["--ui-text-primary"], "action": ["--ui-primary-container"], "actionText": ["--ui-on-primary-container"], "warning": ["--ui-warning"], "warningFill": ["--ui-warning-container"], "warningText": ["--ui-on-warning-container"], "canvasSurface": ["--ui-surface-canvas"], "baseSurface": ["--ui-surface-base"], "inputSurface": ["--ui-surface-low"], "dialogSurface": ["--ui-surface-raised"], "overlaySurface": ["--ui-surface-overlay"], "tooltipSurface": ["--ui-surface-highest"], "textSecondary": ["--ui-text-secondary"], "textDisabled": ["--ui-text-disabled"], "border": ["--ui-border-default"], "outline": ["--ui-outline"], "focus": ["--ui-focus"], "primary": ["--ui-primary"], "primaryText": ["--ui-on-primary"], "actionHover": ["--ui-primary-hover"], "actionFixed": ["--ui-primary-fixed"], "success": ["--ui-success"], "successFill": ["--ui-success-container"], "successText": ["--ui-on-success-container"], "successFixed": ["--ui-success-fixed"], "tertiaryText": ["--ui-on-tertiary"], "danger": ["--ui-danger"]};
        const defaults = {"industrial-light": {"bar": "#dce0dc", "tools": "#e6e8e5", "panel": "#e6e8e5", "status": "#dce0dc", "workspace": "#f1f2f0", "grid": "#bac1bd", "text": "#242a2e", "action": "#8496a4", "actionText": "#16212b", "warning": "#69583e", "warningFill": "#a49478", "warningText": "#282218", "canvasSurface": "#dce0dc", "baseSurface": "#f1f2f0", "inputSurface": "#e6e8e5", "dialogSurface": "#fafbf9", "overlaySurface": "#dde1dd", "tooltipSurface": "#d2d7d3", "textSecondary": "#242a2e", "textDisabled": "#78817f", "border": "#9ca5a7", "outline": "#69767c", "focus": "#596b7a", "primary": "#485d6c", "primaryText": "#ffffff", "actionHover": "#8496a4", "actionFixed": "#8496a4", "success": "#4d6252", "successFill": "#899a8c", "successText": "#19251e", "successFixed": "#bcc8be", "tertiaryText": "#ffffff", "danger": "#7a514d"}, "industrial-dark": {"bar": "#14181b", "tools": "#22282c", "panel": "#22282c", "status": "#14181b", "workspace": "#191d20", "grid": "#384249", "text": "#dde1e3", "action": "#8496a4", "actionText": "#16212b", "warning": "#c4b79b", "warningFill": "#a49478", "warningText": "#282218", "canvasSurface": "#14181b", "baseSurface": "#191d20", "inputSurface": "#22282c", "dialogSurface": "#292f34", "overlaySurface": "#323a40", "tooltipSurface": "#414a51", "textSecondary": "#dde1e3", "textDisabled": "#839098", "border": "#58636b", "outline": "#89959d", "focus": "#727e99", "primary": "#aabbc7", "primaryText": "#16212b", "actionHover": "#8496a4", "actionFixed": "#8496a4", "success": "#adbead", "successFill": "#899a8c", "successText": "#19251e", "successFixed": "#bcc8be", "tertiaryText": "#19251e", "danger": "#ceb3ad"}};
        const required = ["bar", "tools", "panel", "status", "workspace", "grid", "text", "action", "actionText"];
        const custom = preference.customTheme;
        const has = key => Object.prototype.hasOwnProperty.call(custom.colors, key);
        const validCustom = custom && typeof custom === 'object' && !Array.isArray(custom) && ['industrial-light', 'industrial-dark'].includes(custom.base) && (custom.version === undefined || custom.version === 2) && custom.colors && typeof custom.colors === 'object' && !Array.isArray(custom.colors) && required.every(has) && Object.keys(tokens).every(key => !has(key) || typeof custom.colors[key] === 'string' && /^#[0-9a-f]{6}$/i.test(custom.colors[key]));
        const customActive = preference.theme === 'custom' && validCustom;
        const signature = { ...defaults['industrial-light'], textSecondary: '#030303', actionHover: '#749faa', actionFixed: '#749faa', bar: '#ededed', tools: '#ffffff', panel: '#ffffff', status: '#ededed', workspace: '#ededed', grid: '#9e9e9e', text: '#030303', action: '#749faa', actionText: '#ffffff', warning: '#89806c', warningFill: '#89806c', warningText: '#ffffff' };
        const resolved = customActive ? custom.base : theme;
        if (customActive) Object.entries(tokens).forEach(([key, names]) => names.forEach(name => document.documentElement.style.setProperty(name, (Object.prototype.hasOwnProperty.call(custom.colors, key) ? custom.colors[key] : (key === 'textSecondary' ? custom.colors.text : key === 'actionHover' || key === 'actionFixed' ? custom.colors.action : defaults[custom.base][key])).toLowerCase())));
        else if (resolved === 'label-studio-signature') Object.entries(tokens).forEach(([key, names]) => names.forEach(name => document.documentElement.style.setProperty(name, signature[key])));
        document.documentElement.dataset.independentSurfaces = customActive && custom.version === 2 ? 'true' : 'false';
        document.documentElement.dataset.customTheme = customActive ? 'true' : 'false';
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved === 'dark' || resolved === 'industrial-dark' ? 'dark' : 'light';
        document.documentElement.lang = preference.language === 'id' ? 'id' : 'en';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2'><path d='M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z'/><line x1='6' y1='18' x2='18' y2='18'/><line x1='6' y1='14' x2='18' y2='14'/><line x1='9' y1='6' x2='15' y2='6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thermal Label Studio - Data Contract & Vector Designer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  </head>
  <body class="bg-surface text-on-surface font-sans antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
